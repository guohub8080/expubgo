	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>

	<title>ExPubGo</title>
	<style>
		.tmp-loading-wrapper {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: linear-gradient(180deg, #f5f7fa 0%, #c3cfe2 100%);
			z-index: -1;
			/* 加载页临时字体：写死系统栈即可，React 挂载后整个加载页会被替换 */
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
		}

		.tmp-loading-inner {
			text-align: center;
			animation: tmp-loading-fadeIn 0.6s ease-out;
		}

		.tmp-loading-icon {
			width: 120px;
			height: 120px;
			margin: 0 auto 16px;
			animation: tmp-loading-float 3s ease-in-out infinite;
		}

		.tmp-loading-text-logo {
			width: 180px;
			height: 41px;
			margin: 0 auto;
		}

		.tmp-loading-dots {
			display: flex;
			gap: 8px;
			justify-content: center;
			margin-top: 24px;
		}

		.tmp-loading-dot {
			width: 8px;
			height: 8px;
			background: rgba(0, 0, 0, 0.5);
			border-radius: 50%;
			animation: tmp-loading-bounce 1.4s infinite ease-in-out;
		}

		.tmp-loading-dot:nth-child(1) { animation-delay: 0s; }
		.tmp-loading-dot:nth-child(2) { animation-delay: 0.2s; }
		.tmp-loading-dot:nth-child(3) { animation-delay: 0.4s; }

		.tmp-loading-mirror-box {
			opacity: 0;
			animation: tmp-loading-fadeInUp 0.5s ease-out forwards;
			margin: 32px auto 0;
			padding: 22px 22px 20px;
			display: flex;
			flex-direction: column;
			align-items: stretch;
			gap: 14px;
			width: calc(100% - 32px);
			max-width: 640px;
			box-sizing: border-box;
		}

		.tmp-loading-mirror-label {
			font-size: 11px;
			color: rgba(0, 0, 0, 0.4);
			font-weight: 600;
			letter-spacing: 1.2px;
			text-transform: uppercase;
			text-align: center;
		}

		.tmp-loading-mirror-grid {
			display: flex;
			flex-direction: row;
			flex-wrap: wrap;
			justify-content: center;
			gap: 8px;
			width: 100%;
		}

		.tmp-loading-mirror-item {
			flex: 0 1 240px;
			display: flex;
			align-items: center;
			gap: 16px;
			padding: 10px 14px;
			border-radius: 10px;
			background: rgba(255, 255, 255, 0.55);
			border: 1px solid rgba(0, 0, 0, 0.12);
			transition: all 0.2s ease;
			cursor: pointer;
			min-width: 0;
			box-sizing: border-box;
		}

		.tmp-loading-mirror-item:hover {
			background: rgba(255, 255, 255, 0.95);
			border-color: rgba(25, 118, 210, 0.5);
			box-shadow: 0 6px 20px rgba(25, 118, 210, 0.3), 0 2px 6px rgba(25, 118, 210, 0.18);
			transform: translateY(-1px);
		}

		.tmp-loading-mirror-icon {
			width: 24px;
			height: 24px;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
		}

		.tmp-loading-mirror-icon svg {
			display: block;
		}

		.tmp-loading-mirror-info {
			display: flex;
			flex-direction: column;
			gap: 3px;
			min-width: 0;
			flex: 1;
			text-align: left;
		}

		.tmp-loading-mirror-platform {
			font-size: 14px;
			font-weight: 700;
			color: rgba(0, 0, 0, 0.78);
			line-height: 1.2;
			letter-spacing: 0.2px;
		}

		.tmp-loading-mirror-url {
			font-size: 12px;
			color: #1976D2;
			font-weight: 500;
			line-height: 1.2;
			font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
		}

		@keyframes tmp-loading-float {
			0%, 100% { transform: translateY(0px); }
			50% { transform: translateY(-10px); }
		}

		@keyframes tmp-loading-bounce {
			0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
			40% { transform: scale(1.2); opacity: 1; }
		}

		@keyframes tmp-loading-fadeIn {
			from { opacity: 0; transform: translateY(20px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@keyframes tmp-loading-fadeInUp {
			from { opacity: 0; transform: translateY(10px); }
			to { opacity: 1; transform: translateY(0); }
		}
	</style>
