name: Deploy Static Site with Relative Paths

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境（如果是前端项目）
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 安装依赖并构建（私有包认证：install:ci 前置 ci-auth；supply-chain 豁免见 pnpm-workspace.yaml）
      - name: Install and Build
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install -g pnpm@10.23.0
          pnpm install:ci
          pnpm  build:github-pages
        env:
          # 强制 Vite 使用生产环境配置
          NODE_ENV: production
          CI: true
          VITE_GITHUB_PAGES: true  # 设置 VITE_GITHUB_PAGES 环境变量
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}  # 私有包 expub-tool 安装凭证

      # 4. 仅上传构建后的目录（而非整个仓库）
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'github-pages'  # 与 build:github-pages 的产物目录一致

      # 5. 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
